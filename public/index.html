<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="auth-root" hidden></div>

<div id="app" hidden>
<header class="topbar">
  <div class="event-title" id="event-title"></div>
  <div class="spacer"></div>
  <div class="user-menu" id="user-box"></div>
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Navigation">
    <button class="nav" data-view="overview">Übersicht</button>
    <button class="nav" data-view="admin" id="nav-admin" hidden><span class="grow">Verwaltung</span><span class="badge" id="pending-badge" title="Warten auf Freigabe" hidden></span></button>
    <div class="nav-head"><span>Ressorts · <span id="ressort-count">0</span></span><button class="icon-btn" id="btn-new-ressort" aria-label="Ressort hinzufügen" hidden>+</button></div>
    <div id="nav-ressorts"></div>
    <div class="side-note" id="side-note"></div>
  </nav>
  <main id="main"></main>
</div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<template id="tpl-kpi-row">
  <tr>
    <td><div class="kpi-title"></div><div class="muted small kpi-sub"></div></td>
    <td><span class="type-chip"></span></td>
    <td class="num kpi-target"></td>
    <td class="num strong kpi-current"></td>
    <td><div class="bar-row"><div class="bar"><div class="bar-fill"></div></div><span class="muted small num kpi-pct"></span></div></td>
    <td><span class="pill kpi-status"></span></td>
    <td class="small kpi-dates"></td>
    <td><div class="chips kpi-deps"></div></td>
    <td class="actions">
      <button class="icon-btn act-open"></button>
    </td>
  </tr>
</template>

<script src="app.js"></script>
</body>
</html>
