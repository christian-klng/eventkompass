<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eventkompass – OKR Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Eventkompass</div>
  <div class="divider"></div>
  <label for="event-select" class="muted small">Event</label>
  <select id="event-select"></select>
  <button class="btn ghost small-btn" id="btn-new-event">+ Event</button>
  <button class="btn ghost small-btn" id="btn-edit-event" title="Event bearbeiten">Bearbeiten</button>
  <div class="spacer"></div>
  <label for="who" class="muted small">Dein Name</label>
  <input id="who" placeholder="z. B. Lena H." style="width:140px">
</header>

<div class="layout">
  <nav class="sidebar" aria-label="Navigation">
    <button class="nav" data-view="overview">Übersicht</button>
    <button class="nav" data-view="graph">Abhängigkeiten</button>
    <div class="nav-head"><span>Ressorts · <span id="ressort-count">0</span></span><button class="icon-btn" id="btn-new-ressort" aria-label="Ressort hinzufügen">+</button></div>
    <div id="nav-ressorts"></div>
    <div class="side-note" id="side-note"></div>
  </nav>
  <main id="main"></main>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>

<template id="tpl-kpi-row">
  <tr>
    <td><div class="kpi-title"></div><div class="muted small kpi-sub"></div></td>
    <td><span class="type-chip"></span></td>
    <td class="num kpi-target"></td>
    <td class="num strong kpi-current"></td>
    <td><div class="bar-row"><div class="bar"><div class="bar-fill"></div></div><span class="muted small num kpi-pct"></span></div></td>
    <td><span class="pill kpi-status"></span></td>
    <td class="small kpi-dates"></td>
    <td><div class="chips kpi-deps"></div></td>
    <td class="actions">
      <button class="icon-btn act-value" title="Wert eingeben" aria-label="Wert eingeben">✎</button>
      <button class="icon-btn act-history" title="Historie" aria-label="Historie">⟲</button>
      <button class="icon-btn act-achieve" title="Ist-Erreichung" aria-label="Ist-Erreichung">✓</button>
      <button class="icon-btn act-edit" title="Bearbeiten" aria-label="Bearbeiten">⋯</button>
    </td>
  </tr>
</template>

<script src="app.js"></script>
</body>
</html>
